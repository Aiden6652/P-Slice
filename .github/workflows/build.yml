on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      os:
        required: true
        type: string
      buildArgs:
        required: true
        type: string
      artifactName:
        required: true
        type: string
      artifactPath:
        required: true
        type: string
      cachePath:
        required: true
        type: string
      cacheLibrariesPath:
        required: true
        type: string
      exportPath:
        required: true
        type: string

env:
  HAXE_VERSION: 4.3.6
  PROJECT_NAME: PSliceEngine

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}
        
      - name: Restore Libraries for compilation
        id: load-lib-cache
        uses: actions/cache@v3
        with:
          # not caching the bin folder to prevent asset duplication and stuff like that
          key: ${{ inputs.cacheLibrariesPath }}
          fail-on-cache-miss: true
          enableCrossOsArchive: true
          path: |
            .haxelib/
          restore-keys: |
            ${{ inputs.cacheLibrariesPath }}
      - name: Restore existing build cache for faster compilation
        id: load-cache
        uses: actions/cache@v3
        with:
          # not caching the bin folder to prevent asset duplication and stuff like that
          key: ${{ inputs.cachePath }}
          path: |
            export/PE0.6.3/release/${{ inputs.exportPath }}/haxe/
            export/PE0.6.3/release/${{ inputs.exportPath }}/obj/
          restore-keys: |
            cache-build-${{ inputs.exportPath }}
            

      - name: Install libVLC
        if: inputs.exportPath == 'linux'
        run: sudo apt install libvlc-dev libvlccore-dev

      - name: Configure Android
        if: inputs.exportPath == 'android'
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_arm64
          haxelib run lime config ANDROID_SETUP true

      # --- PE0.6.3 内核缺少部分后续版本才加入的移动端类型，
      # --- 这些类型只在 mobile 编译时才被引用，因此桌面构建从未暴露。
      # --- 这里在构建前做最小化补丁，避免改动仓库源码。
      - name: Patch mobile-only types for PE0.6.3
        if: inputs.exportPath == 'ios' || inputs.exportPath == 'android'
        run: |
          set -e
          echo "===== 补丁 1: TouchZone（PE0.6.3 的 source/mobile/objects 下无此类）====="
          FILE1="source/mikolka/vslice/charSelect/CharSelectSubState.hx"
          if [ -f "$FILE1" ]; then
            sed -i '' 's/var touchKeys:Array<TouchZone>;/var touchKeys:Array<Dynamic>;/' "$FILE1"
            echo "--- 补丁后（应显示 Array<Dynamic>）---"
            grep -n "touchKeys" "$FILE1" || echo "（未找到 touchKeys）"
          else
            echo "文件不存在: $FILE1"
          fi

      # --- iOS 专用：lime-pslice 通过 haxelib git 安装时不会拉取 git submodule，
      # --- 导致 lib/hashlink/src/hl.h 缺失（fatal error: 'hl.h' file not found）。
      # --- 参照官方 ios.yml：clone 源码 + haxelib dev 指向它，让 submodule 就位。
      - name: Prepare Lime source with submodules (iOS)
        if: inputs.exportPath == 'ios'
        run: |
          echo "===== 补装依赖 ====="
          haxelib install format --quiet || true
          haxelib install hxp --quiet || true

          echo "===== clone lime-pslice 源码 ====="
          git clone --recursive --depth 1 \
            https://github.com/Psych-Slice/lime-pslice.git lime-src
          cd lime-src
          echo "===== 切到 PE0.6.3 使用的提交 ====="
          git fetch --depth 1 origin 305490d26798c54fad191e983c785015793ed299 || true
          git checkout 305490d26798c54fad191e983c785015793ed299 || true
          echo "===== 拉取 submodule（可能较慢）====="
          git submodule update --init --recursive --depth 1 || true
          cd ..

          echo "===== 检查关键头文件 hl.h ====="
          find lime-src -name "hl.h" -print 2>/dev/null || echo "未找到 hl.h"

          echo "===== 把 lime 指向源码目录 ====="
          haxelib dev lime "$PWD/lime-src"
          haxelib path lime || true

      - name: Rebuild Lime native libs for iOS
        if: inputs.exportPath == 'ios'
        run: |
          echo "===== 重建 iOS 原生库（可能需要较长时间）====="
          haxelib run lime rebuild ios -release -nocolor -nocffi 2>&1 | tee rebuild-ios.log
          echo "===== 重建完成，检查产物 ====="
          find . -type d -name "iPhone" 2>/dev/null || true

      - name: Compile
        run: |
          set -o pipefail
          # 确保 lime 指向带 submodule 的源码目录（iOS）
          if [ "${{ inputs.exportPath }}" = "ios" ] && [ -d lime-src ]; then
            haxelib dev lime "$PWD/lime-src" || true
            haxelib path lime || true
          fi
          haxelib run lime build ${{ inputs.buildArgs }} 2>&1 | tee build-output.log

      # 无论成功失败，都把完整日志存成 artifact，方便排查
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@main
        with:
          name: build-log-${{ inputs.name }}
          path: |
            build-output.log
            rebuild-ios.log
          if-no-files-found: warn

      - name: Make IPA
        if: inputs.name == 'iOS'
        run: |
          cd export/PE0.6.3/release/ios/build/Release-iphoneos
          mkdir Payload
          mv *.app Payload
          zip -r ${{ env.PROJECT_NAME }}.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: ${{ inputs.artifactName }}
          path: ${{ inputs.artifactPath }}
          if-no-files-found: error      
      - name: Clearing already existing cache
        uses: actions/github-script@v6
        with:
          script: |
            const caches = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner,
              repo: context.repo.repo,
            })
            for (const cache of caches.data.actions_caches) {
              if (cache.key == "${{ inputs.cachePath }}") {
                console.log('Clearing ' + cache.key + '...')
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id,
                })
                console.log("Cache cleared.")
              }
            }
      - name: Uploading new cache
        uses: actions/cache@v3
        with:
          key: ${{ inputs.cachePath }}
          path: |
            export/PE0.6.3/release/${{ inputs.exportPath }}/haxe/
            export/PE0.6.3/release/${{ inputs.exportPath }}/obj/
          restore-keys: |
            ${{ inputs.cachePath }}
